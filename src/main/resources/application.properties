server.port=8080
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/medical_reservation
spring.datasource.username=root
spring.datasource.password=Bugiardo7
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
jwt.secret=MedicalReservationSecretKeyMedicalReservationSecretKey
jwt.expiration=86400000
springdoc.swagger-ui.path= /swagger-ui.html
server.servlet.context-path=/medicalreservation
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.fetch_size=100
